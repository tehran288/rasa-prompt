# Local development overrides. Copy next to docker-compose.yml as docker-compose.override.yml
# (compose merges it automatically):
#
#   cp infra/docker-compose.override.example.yml infra/docker-compose.override.yml
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.override.yml up postgres
#   pnpm dev:worker            # or run everything in containers with `up`
#
# - Postgres published on localhost:5432 with throwaway credentials.
# - Bots use long polling (no webhook / TLS needed).
# - Source mounted and run through tsx watch, so no image rebuild per change.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: rasa
    ports: !override
      - "127.0.0.1:5432:5432"

  worker:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev:worker"]
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://rasa:rasa@postgres:5432/rasa
    healthcheck:
      disable: true

  bot-telegram:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm dev:bot:telegram"]
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      BOT_MODE: polling
      DATABASE_URL: postgres://rasa:rasa@postgres:5432/rasa
    depends_on: !override
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  bot-bale:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm dev:bot:bale"]
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      BOT_MODE: polling
      DATABASE_URL: postgres://rasa:rasa@postgres:5432/rasa
    depends_on: !override
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  dev_node_modules:
